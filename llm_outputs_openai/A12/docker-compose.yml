version: '3'

services:
  cve-demo:
    image: a12
    container_name: a12
    build: .
    ports:
      - "22222:11111" 
    cap_add:
      - NET_ADMIN
    volumes:
      - ./:/workspace/wolfssl  # Mount the current directory (with wolfSSL code) to /workspace/wolfssl
      - ./test.py:/workspace/test.py  # Mount test.py directly to the expected location
      - ./:/output   # Mount the output directory to /output
    stdin_open: true
    tty: true